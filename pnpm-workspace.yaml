packages:
  - "packages/*"
  - "apps/*"

allowBuilds:
  '@google/genai': true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  'msgpackr-extract': false
  prisma: true
  protobufjs: true

onlyBuiltDependencies:
  - "@google/genai"
  - "@prisma/client"
  - "@prisma/engines"
  - "esbuild"
  - "prisma"
  - "protobufjs"
